name: 🚀 macOS STV PREMIUM (SSH)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
          - '10h'
          - '12h'

jobs:
  macOS-SSH-Setup:
    runs-on: macos-latest
    timeout-minutes: 780          # tương tự như bản gốc

    steps:
      # ---------- BANNER ----------
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          echo ""
          echo ""
          echo -e "\033[1;33m🍎 AI STV PREMIUM macOS SERVER\033[0m"
          echo -e "\033[1;32m⚡ Powered by AI STV\033[0m"
          echo -e "\033[1;35m🕒 Thời gian: ${{ github.event.inputs.duration }}\033[0m"
          echo ""

          # Hiệu ứng loading đơn giản
          for i in {1..10}; do
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣾"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣽"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣻"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⢿"
            sleep 0.1
          done
          echo -e "\r✅ Hệ thống đã sẵn sàng!                    "

      # ---------- CẤU HÌNH HỆ THỐNG ----------
      - name: 🔧 CẤU HÌNH HỆ THỐNG
        run: |
          echo ""
          echo "🛠️  ĐANG CẤU HÌNH HỆ THỐNG"

          # 1) Bật SSH
          echo "│ 📋 Bật SSH..."
          sudo systemsetup -setremotelogin on

          # 2) Mở cổng 22 trong firewall (Application Firewall)
          echo "│ 📋 Mở port 22 firewall..."
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add /usr/sbin/sshd
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --unblock /usr/sbin/sshd

          # 3) Khởi động lại SSH (để chắc chắn)
          sudo launchctl unload /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo launchctl load /System/Library/LaunchDaemons/ssh.plist

          echo "🎯 Cấu hình hoàn tất!"

      # ---------- TẠO USER PREMIUM ----------
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        run: |
          echo ""
          echo "👤 ĐANG TẠO TÀI KHOẢN PREMIUM"

          # Hàm tạo mật khẩu ngắn (8 ký tự) – dùng /dev/urandom
          function new_password() {
            tr -dc 'A-HJ-NP-Za-km-z2-9' </dev/urandom 2>/dev/null | head -c 8
          }

          # Nếu có secret CUSTOM_SSH_PASS thì dùng, ngược lại tạo ngẫu nhiên
          if [ -n "$CUSTOM_SSH_PASS" ]; then
            PASSWORD="$CUSTOM_SSH_PASS"
            echo "│ ℹ️  Dùng mật khẩu tùy chỉnh từ env"
          else
            PASSWORD=$(new_password)
          fi

          # Xoá user cũ nếu tồn tại
          sudo dscl . -delete /Users/AISTV-PREMIUM 2>/dev/null || true
          sudo rm -rf /Users/AISTV-PREMIUM 2>/dev/null || true

          # Tạo user với sysadminctl (có sẵn từ macOS 10.13+)
          # Lưu ý: sysadminctl yêu cầu mật khẩu ở dạng plaintext – có thể để trống sau đó đặt bằng dscl
          sudo sysadminctl -addUser AISTV-PREMIUM -fullName "AI STV Premium" -password "$PASSWORD" -admin -home /Users/AISTV-PREMIUM 2>/dev/null

          # Nếu sysadminctl không có (trên runner cũ), dùng dscl thủ công
          if [ $? -ne 0 ]; then
            echo "│ ⚠️  sysadminctl không dùng được, thử với dscl..."
            sudo dscl . -create /Users/AISTV-PREMIUM
            sudo dscl . -create /Users/AISTV-PREMIUM RealName "AI STV Premium"
            sudo dscl . -create /Users/AISTV-PREMIUM UserShell /bin/bash
            sudo dscl . -create /Users/AISTV-PREMIUM NFSHomeDirectory /Users/AISTV-PREMIUM
            sudo dscl . -passwd /Users/AISTV-PREMIUM "$PASSWORD"
            sudo dscl . -append /Groups/admin GroupMembership AISTV-PREMIUM
            sudo createhome -c 2>/dev/null || true
          else
            # Đảm bảo user có quyền admin (sysadminctl -admin đã làm điều này)
            sudo dscl . -append /Groups/admin GroupMembership AISTV-PREMIUM
          fi

          echo "│ ✅ Tạo user AISTV-PREMIUM thành công"

          # Lưu thông tin vào file và biến môi trường
          echo "RDP_USER=AISTV-PREMIUM" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV
          echo "$PASSWORD" > /tmp/ssh_password.txt

          echo "✅ Tài khoản: AISTV-PREMIUM đã sẵn sàng"

      # ---------- KIỂM TRA QUYỀN ----------
      - name: 🔍 KIỂM TRA QUYỀN HỆ THỐNG
        run: |
          echo ""
          echo "🔍 KIỂM TRA QUYỀN ĐĂNG NHẬP"

          # Kiểm tra user tồn tại
          if id "AISTV-PREMIUM" &>/dev/null; then
            echo "│ ✅ User AISTV-PREMIUM tồn tại"
          else
            echo "│ ❌ User không tồn tại"
            exit 1
          fi

          # Kiểm tra quyền admin
          if groups AISTV-PREMIUM | grep -q admin; then
            echo "│ ✅ Có quyền Administrator (admin)"
          else
            echo "│ ❌ Không có quyền admin"
          fi

          # Kiểm tra SSH đang chạy
          if sudo systemsetup -getremotelogin | grep -q On; then
            echo "│ ✅ SSH đang bật"
          else
            echo "│ ❌ SSH chưa bật"
          fi

          echo "🎯 Kiểm tra hoàn tất!"

      # ---------- TAILSCALE ----------
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo ""
          echo "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG"

          # Cài Tailscale (dùng brew hoặc curl)
          if ! command -v tailscale &>/dev/null; then
            # Cài bằng brew (nhanh hơn)
            if command -v brew &>/dev/null; then
              brew install tailscale
            else
              # Fallback: tải trực tiếp
              curl -fsSL https://tailscale.com/install.sh | sh
            fi
          fi

          # Kết nối Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="ai-stv-macos-$GITHUB_RUN_ID" --accept-routes --accept-dns --reset

          # Lấy IP (có retry)
          IP=""
          for i in {1..20}; do
            IP=$(tailscale ip -4 2>/dev/null)
            if [[ -n "$IP" && "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "✅ Địa chỉ IP: $IP"
              echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
              break
            fi
            echo -ne "\r🔄 Đang lấy IP... $(printf '.%.0s' $(seq 1 $((i % 3)))) "
            sleep 3
          done

          if [ -z "$IP" ]; then
            echo -e "\r⚠️  Không thể lấy IP, sử dụng localhost"
            echo "TAILSCALE_IP=localhost" >> $GITHUB_ENV
          fi

      # ---------- HIỂN THỊ THÔNG TIN ----------
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          PASSWORD=$(cat /tmp/ssh_password.txt 2>/dev/null || echo "Không thể đọc mật khẩu")

          # Tính thời gian
          DURATION_INPUT="${{ github.event.inputs.duration }}"
          case "$DURATION_INPUT" in
            "1h")   TOTAL_MINUTES=60; DISPLAY_TIME="1 giờ" ;;
            "3h")   TOTAL_MINUTES=180; DISPLAY_TIME="3 giờ" ;;
            "5h40m") TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút" ;;
            "10h")  TOTAL_MINUTES=600; DISPLAY_TIME="10 giờ" ;;
            "12h")  TOTAL_MINUTES=720; DISPLAY_TIME="12 giờ" ;;
            *)      TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút (mặc định)" ;;
          esac

          # Múi giờ UTC+7 (tương tự bản gốc)
          START_TIME=$(date -u -j -f "%s" "$(date +%s)" "+%Y-%m-%d %H:%M:%S" 2>/dev/null || date -u "+%Y-%m-%d %H:%M:%S")
          # Tính end time bằng date (BSD date cần -v)
          END_TIME=$(date -v+${TOTAL_MINUTES}M +"%Y-%m-%d %H:%M:%S" 2>/dev/null || echo "Không tính được")

          echo ""
          echo "┌───────────────────────────────────────────┐"
          echo "│              🎉 KẾT NỐI THÀNH CÔNG!              │"
          echo "├───────────────────────────────────────────┤"
          echo "│ 🌐  Địa chỉ: $TAILSCALE_IP"
          echo "│ 👤  Tài khoản: AISTV-PREMIUM"
          echo "│ 🔐  Mật khẩu: $PASSWORD"
          echo "│ ⏰  Thời lượng: $DISPLAY_TIME"
          echo "│ 🕐  Bắt đầu: $START_TIME"
          echo "│ 🕐  Kết thúc: $END_TIME"
          echo "│ 📍  Port: 22 (SSH)"
          echo "├───────────────────────────────────────────┤"
          echo "│ 💡  Hướng dẫn:                                    │"
          echo "│   1. Mở Terminal và gõ:                          │"
          echo "│      ssh AISTV-PREMIUM@$TAILSCALE_IP             │"
          echo "│   2. Nhập mật khẩu trên.                         │"
          echo "│   3. Enjoy! 🚀                                    │"
          echo "└───────────────────────────────────────────┘"

          echo "TOTAL_MINUTES=$TOTAL_MINUTES" >> $GITHUB_ENV

      # ---------- DUY TRÌ PHIÊN ----------
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          PASSWORD=$(cat /tmp/ssh_password.txt 2>/dev/null)
          if [ -z "$TOTAL_MINUTES" ]; then
            TOTAL_MINUTES=340
          fi

          START_TIME=$(date -u -j -f "%s" "$(date +%s)" "+%s" 2>/dev/null || date -u "+%s")
          END_EPOCH=$((START_TIME + TOTAL_MINUTES * 60))

          echo ""
          echo "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..."
          echo "💎 Phiên: AI STV PREMIUM (macOS)"
          echo "🔗 Kết nối: $TAILSCALE_IP (SSH port 22)"
          echo ""

          while true; do
            NOW=$(date -u "+%s")
            REMAINING=$((END_EPOCH - NOW))
            if [ $REMAINING -le 0 ]; then
              break
            fi

            HOURS=$((REMAINING / 3600))
            MINUTES=$(( (REMAINING % 3600) / 60 ))
            SECONDS=$((REMAINING % 60))

            printf "\r⏳ Thời gian còn lại: %02d:%02d:%02d" $HOURS $MINUTES $SECONDS
            sleep 5
          done

          echo ""
          echo "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!"

      # ---------- DỌN DẸP ----------
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          echo ""
          echo "🧹 ĐANG DỌN DẸP HỆ THỐNG..."

          # Xóa file mật khẩu
          rm -f /tmp/ssh_password.txt

          # Tắt SSH
          sudo systemsetup -setremotelogin off || true

          # Xóa user (nếu muốn)
          sudo dscl . -delete /Users/AISTV-PREMIUM || true
          sudo rm -rf /Users/AISTV-PREMIUM || true

          # Ngắt Tailscale
          sudo tailscale down --accept-risk=all || true

          echo "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋"
