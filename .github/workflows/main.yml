name: 🍎 macOS STV PREMIUM (VNC Remote)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
          - '10h'
          - '12h'

jobs:
  macOS-VNC-Setup:
    runs-on: macos-latest
    timeout-minutes: 780

    steps:
      # ---------- BANNER ----------
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          echo ""
          echo -e "\033[1;33m🍎 AI STV PREMIUM macOS REMOTE SCREEN\033[0m"
          echo -e "\033[1;32m⚡ Powered by AI STV\033[0m"
          echo -e "\033[1;35m🕒 Thời gian: ${{ github.event.inputs.duration }}\033[0m"
          echo ""
          for i in {1..10}; do
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣾"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣽"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣻"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⢿"
            sleep 0.1
          done
          echo -e "\r✅ Hệ thống đã sẵn sàng!                    "

      # ---------- CÀI ĐẶT VNC & CÔNG CỤ ----------
      - name: 🖥️ CÀI ĐẶT VNC SERVER
        run: |
          echo ""
          echo "🖥️  ĐANG CÀI ĐẶT VNC SERVER..."

          # Cài đặt Homebrew nếu chưa có
          if ! command -v brew &>/dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zshrc
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi

          # Cài đặt x11vnc (VNC server) - đây là phương pháp chính
          brew install x11vnc

          # Cài đặt tigervnc-viewer (để test)
          brew install tigervnc-viewer

          # Tạo thư mục cho VNC
          mkdir -p ~/.vnc

          echo "✅ Cài đặt VNC hoàn tất!"

      # ---------- TẠO USER VÀ MẬT KHẨU ----------
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        run: |
          echo ""
          echo "👤 ĐANG TẠO TÀI KHOẢN PREMIUM"

          # Tạo mật khẩu ngẫu nhiên
          if [ -n "$CUSTOM_VNC_PASS" ]; then
            VNC_PASSWORD="$CUSTOM_VNC_PASS"
            echo "│ ℹ️  Dùng mật khẩu tùy chỉnh từ env"
          else
            VNC_PASSWORD=$(tr -dc 'A-HJ-NP-Za-km-z2-9' </dev/urandom 2>/dev/null | head -c 8)
            if [ -z "$VNC_PASSWORD" ]; then
              VNC_PASSWORD=$(openssl rand -base64 6 | tr -d '/+=' | cut -c1-8)
            fi
          fi

          # Lưu mật khẩu
          echo "$VNC_PASSWORD" > ~/.vnc/passwd.txt

          # Tạo user mới (macOS)
          sudo dscl . -delete /Users/AISTV-PREMIUM 2>/dev/null || true
          sudo rm -rf /Users/AISTV-PREMIUM 2>/dev/null || true

          # Tạo user với sysadminctl
          sudo sysadminctl -addUser AISTV-PREMIUM \
                           -fullName "AI STV Premium" \
                           -password "$VNC_PASSWORD" \
                           -admin \
                           -home /Users/AISTV-PREMIUM 2>/dev/null

          if [ $? -ne 0 ]; then
            echo "│ ⚠️  sysadminctl không dùng được, thử với dscl..."
            sudo dscl . -create /Users/AISTV-PREMIUM
            sudo dscl . -create /Users/AISTV-PREMIUM RealName "AI STV Premium"
            sudo dscl . -create /Users/AISTV-PREMIUM UserShell /bin/bash
            sudo dscl . -create /Users/AISTV-PREMIUM NFSHomeDirectory /Users/AISTV-PREMIUM
            sudo dscl . -passwd /Users/AISTV-PREMIUM "$VNC_PASSWORD"
            sudo dscl . -append /Groups/admin GroupMembership AISTV-PREMIUM
          fi

          # Thêm user vào nhóm admin
          sudo dscl . -append /Groups/admin GroupMembership AISTV-PREMIUM

          echo "│ ✅ Tạo user AISTV-PREMIUM thành công"
          echo "VNC_USER=AISTV-PREMIUM" >> $GITHUB_ENV
          echo "VNC_PASS=$VNC_PASSWORD" >> $GITHUB_ENV
          echo "$VNC_PASSWORD" > /tmp/vnc_password.txt

          echo "✅ Tài khoản: AISTV-PREMIUM đã sẵn sàng"

      # ---------- CẤU HÌNH VNC (x11vnc) ----------
      - name: 🔧 CẤU HÌNH REMOTE SCREEN (VNC)
        run: |
          echo ""
          echo "🔧 CẤU HÌNH REMOTE SCREEN VNC..."

          # macOS runner có sẵn DISPLAY=:0, sử dụng trực tiếp
          export DISPLAY=:0
          
          # Kiểm tra display
          if [ -z "$DISPLAY" ]; then
            echo "│ ⚠️  Không tìm thấy DISPLAY, sử dụng :0"
            export DISPLAY=:0
          fi
          
          # Kiểm tra xem có thể truy cập display không
          if ! xdpyinfo 2>/dev/null; then
            echo "│ ⚠️  Display không khả dụng, sẽ sử dụng Xvfb (cần cài đặt)"
            # Cài XQuartz (cung cấp X server cho macOS)
            brew install --cask xquartz
            # Khởi động X server
            open -a XQuartz
            sleep 10
          fi

          # Khởi động x11vnc với mật khẩu
          echo "│ 📋 Khởi động x11vnc VNC server..."
          
          # Tạo file mật khẩu đúng định dạng cho x11vnc
          echo "$VNC_PASS" | x11vnc -storepasswd - > ~/.vnc/passwd 2>/dev/null
          chmod 600 ~/.vnc/passwd

          # Chạy x11vnc
          nohup x11vnc -display "$DISPLAY" \
                       -rfbauth ~/.vnc/passwd \
                       -forever \
                       -shared \
                       -rfbport 5900 \
                       -logfile ~/.vnc/x11vnc.log \
                       > ~/.vnc/vnc.log 2>&1 &

          # Đợi VNC server khởi động
          sleep 5

          # Kiểm tra VNC server đang chạy
          if pgrep -f x11vnc > /dev/null; then
            echo "│ ✅ x11vnc đang chạy trên port 5900"
          else
            echo "│ ❌ x11vnc không khởi động được, thử lại với cách khác..."
            # Thử chạy không có password auth
            nohup x11vnc -display "$DISPLAY" \
                         -passwd "$VNC_PASS" \
                         -forever \
                         -shared \
                         -rfbport 5900 \
                         > ~/.vnc/vnc.log 2>&1 &
            sleep 3
            if pgrep -f x11vnc > /dev/null; then
              echo "│ ✅ x11vnc đã khởi động thành công (không auth file)"
            else
              echo "│ ❌ Vẫn không khởi động được, kiểm tra log:"
              cat ~/.vnc/vnc.log
              exit 1
            fi
          fi

          echo "✅ Cấu hình VNC hoàn tất!"

      # ---------- TAILSCALE ----------
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo ""
          echo "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG"

          # Cài Tailscale
          if ! command -v tailscale &>/dev/null; then
            if command -v brew &>/dev/null; then
              export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
              brew install tailscale
            else
              curl -fsSL https://tailscale.com/install.sh | sh
            fi
          fi

          # Khởi động daemon Tailscale
          echo "│ 📋 Khởi động Tailscale daemon..."
          sudo mkdir -p /var/lib/tailscale
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state &
          sleep 5

          # Kết nối với auth key
          echo "│ 📋 Kết nối Tailscale..."
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" \
                            --hostname="ai-stv-macos-vnc-$GITHUB_RUN_ID" \
                            --accept-routes --accept-dns --reset

          # Lấy IP
          IP=""
          for i in {1..20}; do
            IP=$(tailscale ip -4 2>/dev/null)
            if [[ -n "$IP" && "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "✅ Địa chỉ IP: $IP"
              echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
              break
            fi
            echo -ne "\r🔄 Đang lấy IP... $(printf '.%.0s' $(seq 1 $((i % 3)))) "
            sleep 3
          done

          if [ -z "$IP" ]; then
            echo -e "\r⚠️  Không thể lấy IP, sử dụng localhost"
            echo "TAILSCALE_IP=localhost" >> $GITHUB_ENV
          fi

      # ---------- HIỂN THỊ THÔNG TIN ----------
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          PASSWORD=$(cat /tmp/vnc_password.txt 2>/dev/null || echo "$VNC_PASS")

          DURATION_INPUT="${{ github.event.inputs.duration }}"
          case "$DURATION_INPUT" in
            "1h")   TOTAL_MINUTES=60; DISPLAY_TIME="1 giờ" ;;
            "3h")   TOTAL_MINUTES=180; DISPLAY_TIME="3 giờ" ;;
            "5h40m") TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút" ;;
            "10h")  TOTAL_MINUTES=600; DISPLAY_TIME="10 giờ" ;;
            "12h")  TOTAL_MINUTES=720; DISPLAY_TIME="12 giờ" ;;
            *)      TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút (mặc định)" ;;
          esac

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))
          START_DATE=$(date -u -r "$START_EPOCH" "+%Y-%m-%d %H:%M:%S")
          END_DATE=$(date -u -r "$END_EPOCH" "+%Y-%m-%d %H:%M:%S")

          echo ""
          echo "┌───────────────────────────────────────────────────────┐"
          echo "│              🎉 KẾT NỐI THÀNH CÔNG!                        │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🌐  Địa chỉ IP: $TAILSCALE_IP"
          echo "│ 👤  Tài khoản: AISTV-PREMIUM"
          echo "│ 🔐  Mật khẩu VNC: $PASSWORD"
          echo "│ 🔐  SSH Password: $PASSWORD (cùng mật khẩu)"
          echo "│ ⏰  Thời lượng: $DISPLAY_TIME"
          echo "│ 🕐  Bắt đầu: $START_DATE (UTC)"
          echo "│ 🕐  Kết thúc: $END_DATE (UTC)"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 📍  PORT: 5900 (VNC)                                        │"
          echo "│ 📍  PORT: 22 (SSH)                                         │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 💡  HƯỚNG DẪN KẾT NỐI:                                    │"
          echo "│                                                               │"
          echo "│  Cách 1 - VNC Client (GUI):                                  │"
          echo "│    - macOS: Mở Finder → Go → Connect to Server              │"
          echo "│      Nhập: vnc://$TAILSCALE_IP                              │"
          echo "│    - Windows: Dùng TigerVNC, RealVNC, TightVNC              │"
          echo "│      Server: $TAILSCALE_IP:5900                            │"
          echo "│    - Linux: Dùng Remmina, TigerVNC, Vinagre                 │"
          echo "│                                                               │"
          echo "│  Cách 2 - SSH (terminal):                                     │"
          echo "│    ssh AISTV-PREMIUM@$TAILSCALE_IP                         │"
          echo "│    Password: $PASSWORD                                      │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🚀  Enjoy your remote macOS session!                           │"
          echo "└───────────────────────────────────────────────────────┘"

          echo "TOTAL_MINUTES=$TOTAL_MINUTES" >> $GITHUB_ENV

      # ---------- DUY TRÌ PHIÊN ----------
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          if [ -z "$TOTAL_MINUTES" ]; then
            TOTAL_MINUTES=340
          fi

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))

          echo ""
          echo "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..."
          echo "💎 Phiên: AI STV PREMIUM (macOS VNC)"
          echo "🔗 Kết nối VNC: $TAILSCALE_IP:5900"
          echo "🔗 Kết nối SSH: $TAILSCALE_IP:22"
          echo ""

          # Giám sát VNC server
          while true; do
            NOW=$(date -u "+%s")
            REMAINING=$((END_EPOCH - NOW))
            
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            # Kiểm tra VNC server mỗi 2 phút
            if (( REMAINING % 120 < 5 )); then
              if ! pgrep -f x11vnc > /dev/null; then
                echo -e "\n⚠️  VNC server đã dừng, khởi động lại..."
                export DISPLAY=:0
                nohup x11vnc -display "$DISPLAY" -passwd "$VNC_PASS" -forever -shared -rfbport 5900 &
              fi
            fi
            
            H=$((REMAINING / 3600))
            M=$(( (REMAINING % 3600) / 60 ))
            S=$((REMAINING % 60))
            printf "\r⏳ Thời gian còn lại: %02d:%02d:%02d" $H $M $S
            sleep 5
          done

          echo ""
          echo "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!"

      # ---------- DỌN DẸP ----------
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          echo ""
          echo "🧹 ĐANG DỌN DẸP HỆ THỐNG..."

          # Dừng VNC servers
          pkill -f x11vnc 2>/dev/null || true

          # Xóa file mật khẩu
          rm -f /tmp/vnc_password.txt
          rm -rf ~/.vnc

          # Xóa user
          sudo dscl . -delete /Users/AISTV-PREMIUM 2>/dev/null || true
          sudo rm -rf /Users/AISTV-PREMIUM 2>/dev/null || true

          # Ngắt Tailscale
          sudo tailscale down --accept-risk=all 2>/dev/null || true
          sudo pkill -f tailscaled 2>/dev/null || true

          echo "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋"
