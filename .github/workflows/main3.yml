name: 🐧 Ubuntu Desktop STV PREMIUM (RDP)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
          - '10h'
          - '12h'

jobs:
  Ubuntu-RDP-Setup:
    runs-on: ubuntu-latest
    timeout-minutes: 780

    steps:
      # ---------- BANNER ----------
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          echo ""
          echo -e "\033[1;33m🐧 AI STV PREMIUM UBUNTU DESKTOP\033[0m"
          echo -e "\033[1;32m⚡ Powered by AI STV\033[0m"
          echo -e "\033[1;35m🕒 Thời gian: ${{ github.event.inputs.duration }}\033[0m"
          echo ""
          for i in {1..10}; do
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣾"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣽"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣻"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⢿"
            sleep 0.1
          done
          echo -e "\r✅ Hệ thống đã sẵn sàng!                    "

      # ---------- CÀI ĐẶT DESKTOP ----------
      - name: 🖥️ CÀI ĐẶT XFCE & xRDP
        run: |
          echo ""
          echo "🖥️  ĐANG CÀI ĐẶT XFCE + xRDP..."

          # Cập nhật và cài đặt
          sudo apt update -y
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorg \
            xserver-xorg-core

          # Cấu hình D-Bus
          sudo systemctl enable dbus
          sudo systemctl start dbus

          # Cấu hình xrdp
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

          # Tạo file .xsession cho user
          echo "startxfce4" | sudo tee /etc/skel/.xsession
          echo "startxfce4" | sudo tee /root/.xsession

          # Tạo file .xinitrc
          echo "exec startxfce4" | sudo tee /etc/skel/.xinitrc
          echo "exec startxfce4" | sudo tee /root/.xinitrc

          # Cấu hình startwm.sh cho xrdp
          sudo tee /etc/xrdp/startwm.sh << 'EOF'
          #!/bin/sh
          if test -r /etc/profile; then
            . /etc/profile
          fi

          if test -r /etc/default/locale; then
            . /etc/default/locale
            test -z "${LANG:-}" || export LANG
            test -z "${LANGUAGE:-}" || export LANGUAGE
            test -z "${LC_ALL:-}" || export LC_ALL
            test -z "${LC_MESSAGES:-}" || export LC_MESSAGES
          fi

          if test -r ~/.profile; then
            . ~/.profile
          fi

          # Start XFCE session
          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Mở port 3389 trên firewall
          sudo ufw allow 3389/tcp || true

          # Restart xrdp
          sudo systemctl restart xrdp

          echo "✅ Cài đặt hoàn tất!"

      # ---------- TẠO USER ----------
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        run: |
          echo ""
          echo "👤 ĐANG TẠO TÀI KHOẢN PREMIUM"

          # Tạo mật khẩu ngẫu nhiên
          if [ -n "$CUSTOM_RDP_PASS" ]; then
            PASSWORD="$CUSTOM_RDP_PASS"
            echo "│ ℹ️  Dùng mật khẩu tùy chỉnh từ env"
          else
            PASSWORD=$(tr -dc 'A-HJ-NP-Za-km-z2-9' </dev/urandom 2>/dev/null | head -c 8)
            if [ -z "$PASSWORD" ]; then
              PASSWORD=$(date +%s | sha256sum | base64 | head -c 8)
            fi
          fi

          # Xóa user cũ
          sudo userdel -r AISTV-PREMIUM 2>/dev/null || true

          # Tạo user mới
          sudo useradd -m -s /bin/bash AISTV-PREMIUM
          echo "AISTV-PREMIUM:$PASSWORD" | sudo chpasswd

          # Thêm vào nhóm sudo
          sudo usermod -aG sudo AISTV-PREMIUM
          echo "AISTV-PREMIUM ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/AISTV-PREMIUM

          # Copy cấu hình từ /etc/skel
          sudo cp -r /etc/skel/. /home/AISTV-PREMIUM/
          sudo chown -R AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM

          # Tạo file .xsession cho user
          echo "startxfce4" | sudo tee /home/AISTV-PREMIUM/.xsession
          echo "exec startxfce4" | sudo tee /home/AISTV-PREMIUM/.xinitrc
          sudo chown AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM/.xsession
          sudo chown AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM/.xinitrc

          echo "│ ✅ Tạo user AISTV-PREMIUM thành công"
          echo "RDP_USER=AISTV-PREMIUM" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV
          echo "$PASSWORD" > /tmp/rdp_password.txt

          echo "✅ Tài khoản: AISTV-PREMIUM đã sẵn sàng"

      # ---------- TAILSCALE ----------
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo ""
          echo "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG"

          # Cài Tailscale
          if ! command -v tailscale &>/dev/null; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          # Kết nối
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" \
                            --hostname="ai-stv-ubuntu-$GITHUB_RUN_ID" \
                            --accept-routes --accept-dns --reset

          # Lấy IP
          IP=""
          for i in {1..20}; do
            IP=$(tailscale ip -4 2>/dev/null)
            if [[ -n "$IP" && "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "✅ Địa chỉ IP: $IP"
              echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
              break
            fi
            echo -ne "\r🔄 Đang lấy IP... $(printf '.%.0s' $(seq 1 $((i % 3)))) "
            sleep 3
          done

          if [ -z "$IP" ]; then
            echo -e "\r⚠️  Không thể lấy IP, sử dụng localhost"
            echo "TAILSCALE_IP=localhost" >> $GITHUB_ENV
          fi

      # ---------- HIỂN THỊ THÔNG TIN ----------
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          PASSWORD=$(cat /tmp/rdp_password.txt 2>/dev/null || echo "Không thể đọc mật khẩu")

          DURATION_INPUT="${{ github.event.inputs.duration }}"
          case "$DURATION_INPUT" in
            "1h")   TOTAL_MINUTES=60; DISPLAY_TIME="1 giờ" ;;
            "3h")   TOTAL_MINUTES=180; DISPLAY_TIME="3 giờ" ;;
            "5h40m") TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút" ;;
            "10h")  TOTAL_MINUTES=600; DISPLAY_TIME="10 giờ" ;;
            "12h")  TOTAL_MINUTES=720; DISPLAY_TIME="12 giờ" ;;
            *)      TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút (mặc định)" ;;
          esac

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))
          START_DATE=$(date -u -d "@$START_EPOCH" "+%Y-%m-%d %H:%M:%S")
          END_DATE=$(date -u -d "@$END_EPOCH" "+%Y-%m-%d %H:%M:%S")

          echo ""
          echo "┌───────────────────────────────────────────────────────┐"
          echo "│              🎉 KẾT NỐI THÀNH CÔNG!                        │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🌐  Địa chỉ IP: $TAILSCALE_IP"
          echo "│ 👤  Tài khoản: AISTV-PREMIUM"
          echo "│ 🔐  Mật khẩu: $PASSWORD"
          echo "│ ⏰  Thời lượng: $DISPLAY_TIME"
          echo "│ 🕐  Bắt đầu: $START_DATE (UTC)"
          echo "│ 🕐  Kết thúc: $END_DATE (UTC)"
          echo "│ 📍  Port: 3389 (RDP)"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 💡  HƯỚNG DẪN KẾT NỐI:                                    │"
          echo "│                                                               │"
          echo "│  Windows:                                                   │"
          echo "│    - Mở Remote Desktop Connection (mstsc)                    │"
          echo "│    - Nhập: $TAILSCALE_IP                                    │"
          echo "│                                                               │"
          echo "│  macOS:                                                     │"
          echo "│    - Cài Microsoft Remote Desktop từ App Store              │"
          echo "│    - Add PC → PC name: $TAILSCALE_IP                       │"
          echo "│                                                               │"
          echo "│  Linux:                                                     │"
          echo "│    - Remmina hoặc Vinagre: $TAILSCALE_IP                   │"
          echo "│                                                               │"
          echo "│  Username: AISTV-PREMIUM                                      │"
          echo "│  Password: $PASSWORD                                        │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🚀  Enjoy your Ubuntu Desktop!                                  │"
          echo "└───────────────────────────────────────────────────────┘"

          echo "TOTAL_MINUTES=$TOTAL_MINUTES" >> $GITHUB_ENV

      # ---------- DUY TRÌ PHIÊN ----------
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          if [ -z "$TOTAL_MINUTES" ]; then
            TOTAL_MINUTES=340
          fi

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))

          echo ""
          echo "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..."
          echo "💎 Phiên: AI STV PREMIUM (Ubuntu Desktop)"
          echo "🔗 Kết nối: $TAILSCALE_IP (RDP port 3389)"
          echo ""
          echo "📌 Lưu ý: Lần đầu kết nối có thể mất 10-15 giây để load desktop"
          echo ""

          while true; do
            NOW=$(date -u "+%s")
            REMAINING=$((END_EPOCH - NOW))
            
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            # Kiểm tra xrdp mỗi 2 phút
            if (( REMAINING % 120 < 5 )); then
              if ! systemctl is-active --quiet xrdp; then
                echo -e "\n⚠️  xrdp đã dừng, khởi động lại..."
                sudo systemctl restart xrdp
              fi
            fi
            
            H=$((REMAINING / 3600))
            M=$(( (REMAINING % 3600) / 60 ))
            S=$((REMAINING % 60))
            printf "\r⏳ Thời gian còn lại: %02d:%02d:%02d" $H $M $S
            sleep 5
          done

          echo ""
          echo "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!"

      # ---------- DỌN DẸP ----------
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          echo ""
          echo "🧹 ĐANG DỌN DẸP HỆ THỐNG..."

          # Xóa file mật khẩu
          rm -f /tmp/rdp_password.txt

          # Dừng xrdp
          sudo systemctl stop xrdp || true
          sudo systemctl disable xrdp || true
          
          # Xóa firewall rules
          sudo ufw delete allow 3389/tcp || true

          # Xóa user
          sudo userdel -r AISTV-PREMIUM 2>/dev/null || true
          sudo rm -f /etc/sudoers.d/AISTV-PREMIUM

          # Ngắt Tailscale
          sudo tailscale down --accept-risk=all 2>/dev/null || true

          echo "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋"
