name: 🐧 Ubuntu Desktop STV PREMIUM (RDP)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
          - '10h'
          - '12h'

jobs:
  Ubuntu-RDP-Setup:
    runs-on: ubuntu-latest
    timeout-minutes: 780

    steps:
      # ---------- BANNER ----------
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        run: |
          echo ""
          echo -e "\033[1;33m🐧 AI STV PREMIUM UBUNTU DESKTOP\033[0m"
          echo -e "\033[1;32m⚡ Powered by AI STV\033[0m"
          echo -e "\033[1;35m🕒 Thời gian: ${{ github.event.inputs.duration }}\033[0m"
          echo ""
          for i in {1..10}; do
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣾"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣽"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⣻"
            sleep 0.1
            echo -ne "\r🚀 Đang khởi tạo hệ thống... ⢿"
            sleep 0.1
          done
          echo -e "\r✅ Hệ thống đã sẵn sàng!                    "

      # ---------- CÀI ĐẶT MÔI TRƯỜNG DESKTOP (XFCE + xRDP) ----------
      - name: 🖥️ CÀI ĐẶT DESKTOP & RDP
        run: |
          echo ""
          echo "🖥️  ĐANG CÀI ĐẶT XFCE + xRDP..."

          # Cập nhật hệ thống
          sudo apt update -y
          
          # Cài đặt XFCE Desktop Environment
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorg \
            xserver-xorg-core \
            xserver-xorg-video-dummy \
            policykit-1 \
            network-manager-gnome \
            xubuntu-icon-theme \
            xfce4-terminal \
            thunar \
            mousepad \
            ristretto

          # Cài đặt thêm các gói hữu ích
          sudo apt install -y \
            htop \
            nano \
            vim \
            curl \
            wget \
            git \
            firefox \
            chromium-browser \
            ubuntu-restricted-extras \
            unzip \
            zip \
            build-essential

          # Đảm bảo D-Bus được cấu hình đúng
          sudo systemctl enable dbus
          sudo systemctl start dbus

          # Cấu hình xrdp
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

          # Tạo thư mục cấu hình cho XFCE trong /etc/skel
          sudo mkdir -p /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/
          sudo mkdir -p /etc/skel/.config/autostart
          sudo mkdir -p /etc/skel/.config/xfce4/desktop
          sudo mkdir -p /etc/skel/.config/xfce4-session/

          # Tạo file .xsession cho user
          echo "xfce4-session" | sudo tee /etc/skel/.xsession
          echo "xfce4-session" | sudo tee /root/.xsession

          # Tạo file .xinitrc
          echo "exec xfce4-session" | sudo tee /etc/skel/.xinitrc
          echo "exec xfce4-session" | sudo tee /root/.xinitrc

          # Tạo file cấu hình xfce4-session.xml (QUAN TRỌNG để tránh lỗi failsafe)
          sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-session" version="1.0">
            <property name="general" type="empty">
              <property name="FailsafeSessionName" type="string" value="Default"/>
              <property name="SessionName" type="string" value="Default"/>
              <property name="SaveOnExit" type="bool" value="false"/>
            </property>
            <property name="sessions" type="empty">
              <property name="Default" type="empty">
                <property name="Startup" type="empty">
                  <property name="0" type="int" value="0"/>
                </property>
              </property>
            </property>
          </channel>
          EOF

          # Tạo file cấu hình desktop
          sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="workspace0" type="empty">
                    <property name="last-image" type="string" value="/usr/share/xfce4/backdrops/xfce-blue.png"/>
                    <property name="image-style" type="int" value="5"/>
                    <property name="image-show" type="bool" value="true"/>
                  </property>
                </property>
              </property>
            </property>
            <property name="desktop-icons" type="empty">
              <property name="style" type="int" value="0"/>
            </property>
          </channel>
          EOF

          # Tạo file panel cấu hình
          sudo tee /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="panels" type="array">
              <value type="int" value="1"/>
              <property name="panel-1" type="empty">
                <property name="position" type="string" value="p=6;x=0;y=0"/>
                <property name="length" type="int" value="100"/>
                <property name="size" type="int" value="30"/>
                <property name="plugin-ids" type="array">
                  <value type="int" value="1"/>
                  <value type="int" value="2"/>
                  <value type="int" value="3"/>
                  <value type="int" value="4"/>
                </property>
              </property>
            </property>
          </channel>
          EOF

          # Tạo file xfce4-session.rc để tránh lỗi
          sudo tee /etc/skel/.config/xfce4-session/session.rc << 'EOF'
          [Failsafe]
          FailsafeSessionName=Default
          EOF

          # Tạo file xfce4-session.rc mặc định toàn hệ thống
          sudo mkdir -p /etc/xdg/xfce4-session/
          sudo tee /etc/xdg/xfce4-session/session.rc << 'EOF'
          [Failsafe]
          FailsafeSessionName=Default
          EOF

          # Cấu hình xrdp để sử dụng Xorg
          sudo sed -i 's/^port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^use_vsock=false/use_vsock=false/g' /etc/xrdp/xrdp.ini
          
          # Thêm section Xorg vào xrdp.ini (nếu chưa có)
          if ! grep -q "^\[Xorg\]" /etc/xrdp/xrdp.ini; then
            sudo tee -a /etc/xrdp/xrdp.ini << 'EOF'
          [Xorg]
          name=Xorg
          lib=libxup.so
          username=ask
          password=ask
          ip=127.0.0.1
          port=-1
          code=20
          EOF
          fi

          # Cấu hình startwm.sh
          sudo tee /etc/xrdp/startwm.sh << 'EOF'
          #!/bin/sh
          # xrdp X session start script (c) 2015, 2020 mirabilos
          # published under The MirOS Licence

          if test -r /etc/profile; then
            . /etc/profile
          fi

          if test -r /etc/default/locale; then
            . /etc/default/locale
            test -z "${LANG:-}" || export LANG
            test -z "${LANGUAGE:-}" || export LANGUAGE
            test -z "${LC_ALL:-}" || export LC_ALL
            test -z "${LC_MESSAGES:-}" || export LC_MESSAGES
          fi

          if test -r ~/.profile; then
            . ~/.profile
          fi

          # Start XFCE session
          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # Mở port 3389 trên firewall
          sudo ufw allow 3389/tcp || true
          sudo ufw allow 3389/udp || true

          # Restart xrdp để áp dụng cấu hình
          sudo systemctl restart xrdp

          echo "✅ Cài đặt hoàn tất!"

      # ---------- TẠO USER PREMIUM ----------
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        run: |
          echo ""
          echo "👤 ĐANG TẠO TÀI KHOẢN PREMIUM"

          # Tạo mật khẩu ngẫu nhiên
          if [ -n "$CUSTOM_RDP_PASS" ]; then
            PASSWORD="$CUSTOM_RDP_PASS"
            echo "│ ℹ️  Dùng mật khẩu tùy chỉnh từ env"
          else
            PASSWORD=$(tr -dc 'A-HJ-NP-Za-km-z2-9' </dev/urandom 2>/dev/null | head -c 8)
            if [ -z "$PASSWORD" ]; then
              PASSWORD=$(date +%s | sha256sum | base64 | head -c 8)
            fi
          fi

          # Xóa user cũ nếu có
          sudo userdel -r AISTV-PREMIUM 2>/dev/null || true

          # Tạo user mới
          sudo useradd -m -s /bin/bash AISTV-PREMIUM
          echo "AISTV-PREMIUM:$PASSWORD" | sudo chpasswd

          # Thêm vào nhóm sudo và cho phép sudo không cần mật khẩu
          sudo usermod -aG sudo AISTV-PREMIUM
          sudo usermod -aG adm AISTV-PREMIUM
          sudo usermod -aG ssl-cert AISTV-PREMIUM
          
          echo "AISTV-PREMIUM ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/AISTV-PREMIUM

          # Copy cấu hình từ /etc/skel
          sudo cp -r /etc/skel/. /home/AISTV-PREMIUM/
          sudo chown -R AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM

          # Đảm bảo các thư mục và file cấu hình được tạo đúng
          sudo mkdir -p /home/AISTV-PREMIUM/.config/xfce4/xfconf/xfce-perchannel-xml/
          sudo mkdir -p /home/AISTV-PREMIUM/.config/xfce4-session/

          # Tạo lại file .xsession cho user
          echo "xfce4-session" | sudo tee /home/AISTV-PREMIUM/.xsession
          echo "exec xfce4-session" | sudo tee /home/AISTV-PREMIUM/.xinitrc
          
          # Set permissions
          sudo chmod 644 /home/AISTV-PREMIUM/.xsession
          sudo chmod 755 /home/AISTV-PREMIUM/.xinitrc
          sudo chown AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM/.xsession
          sudo chown AISTV-PREMIUM:AISTV-PREMIUM /home/AISTV-PREMIUM/.xinitrc

          echo "│ ✅ Tạo user AISTV-PREMIUM thành công"
          echo "RDP_USER=AISTV-PREMIUM" >> $GITHUB_ENV
          echo "RDP_PASS=$PASSWORD" >> $GITHUB_ENV
          echo "$PASSWORD" > /tmp/rdp_password.txt

          echo "✅ Tài khoản: AISTV-PREMIUM đã sẵn sàng"

      # ---------- KIỂM TRA HỆ THỐNG ----------
      - name: 🔍 KIỂM TRA CẤU HÌNH
        run: |
          echo ""
          echo "🔍 KIỂM TRA CẤU HÌNH HỆ THỐNG"

          # Kiểm tra user
          if id "AISTV-PREMIUM" &>/dev/null; then
            echo "│ ✅ User AISTV-PREMIUM tồn tại"
          else
            echo "│ ❌ User không tồn tại"
            exit 1
          fi

          # Kiểm tra xrdp
          if systemctl is-active --quiet xrdp; then
            echo "│ ✅ xrdp đang chạy"
          else
            echo "│ ❌ xrdp không chạy"
            sudo systemctl status xrdp
          fi

          # Kiểm tra port 3389
          if ss -tuln | grep -q ":3389"; then
            echo "│ ✅ Port 3389 đang lắng nghe"
          else
            echo "│ ❌ Port 3389 không lắng nghe"
          fi

          echo "🎯 Kiểm tra hoàn tất!"

      # ---------- TAILSCALE ----------
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo ""
          echo "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG"

          # Cài Tailscale
          if ! command -v tailscale &>/dev/null; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          # Kết nối
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" \
                            --hostname="ai-stv-ubuntu-$GITHUB_RUN_ID" \
                            --accept-routes --accept-dns --reset

          # Lấy IP
          IP=""
          for i in {1..20}; do
            IP=$(tailscale ip -4 2>/dev/null)
            if [[ -n "$IP" && "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "✅ Địa chỉ IP: $IP"
              echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
              break
            fi
            echo -ne "\r🔄 Đang lấy IP... $(printf '.%.0s' $(seq 1 $((i % 3)))) "
            sleep 3
          done

          if [ -z "$IP" ]; then
            echo -e "\r⚠️  Không thể lấy IP, sử dụng localhost"
            echo "TAILSCALE_IP=localhost" >> $GITHUB_ENV
          fi

      # ---------- HIỂN THỊ THÔNG TIN ----------
      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          PASSWORD=$(cat /tmp/rdp_password.txt 2>/dev/null || echo "Không thể đọc mật khẩu")

          DURATION_INPUT="${{ github.event.inputs.duration }}"
          case "$DURATION_INPUT" in
            "1h")   TOTAL_MINUTES=60; DISPLAY_TIME="1 giờ" ;;
            "3h")   TOTAL_MINUTES=180; DISPLAY_TIME="3 giờ" ;;
            "5h40m") TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút" ;;
            "10h")  TOTAL_MINUTES=600; DISPLAY_TIME="10 giờ" ;;
            "12h")  TOTAL_MINUTES=720; DISPLAY_TIME="12 giờ" ;;
            *)      TOTAL_MINUTES=340; DISPLAY_TIME="5 giờ 40 phút (mặc định)" ;;
          esac

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))
          START_DATE=$(date -u -d "@$START_EPOCH" "+%Y-%m-%d %H:%M:%S")
          END_DATE=$(date -u -d "@$END_EPOCH" "+%Y-%m-%d %H:%M:%S")

          echo ""
          echo "┌───────────────────────────────────────────────────────┐"
          echo "│              🎉 KẾT NỐI THÀNH CÔNG!                        │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🌐  Địa chỉ IP: $TAILSCALE_IP"
          echo "│ 👤  Tài khoản: AISTV-PREMIUM"
          echo "│ 🔐  Mật khẩu: $PASSWORD"
          echo "│ ⏰  Thời lượng: $DISPLAY_TIME"
          echo "│ 🕐  Bắt đầu: $START_DATE (UTC)"
          echo "│ 🕐  Kết thúc: $END_DATE (UTC)"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 💡  HƯỚNG DẪN KẾT NỐI:                                    │"
          echo "│                                                               │"
          echo "│  Windows:                                                   │"
          echo "│    - Mở Remote Desktop Connection (mstsc)                    │"
          echo "│    - Nhập: $TAILSCALE_IP                                    │"
          echo "│    - User: AISTV-PREMIUM                                     │"
          echo "│    - Password: $PASSWORD                                    │"
          echo "│                                                               │"
          echo "│  macOS:                                                     │"
          echo "│    - Cài Microsoft Remote Desktop từ App Store              │"
          echo "│    - Add PC → PC name: $TAILSCALE_IP                       │"
          echo "│    - User: AISTV-PREMIUM                                     │"
          echo "│    - Password: $PASSWORD                                    │"
          echo "│                                                               │"
          echo "│  Linux:                                                     │"
          echo "│    - Cài Remmina: sudo apt install remmina                   │"
          echo "│    - Chọn RDP → Nhập IP và credentials                      │"
          echo "├───────────────────────────────────────────────────────┤"
          echo "│ 🚀  Enjoy your Ubuntu Desktop!                                  │"
          echo "└───────────────────────────────────────────────────────┘"

          echo "TOTAL_MINUTES=$TOTAL_MINUTES" >> $GITHUB_ENV

      # ---------- DUY TRÌ PHIÊN ----------
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        run: |
          if [ -z "$TOTAL_MINUTES" ]; then
            TOTAL_MINUTES=340
          fi

          START_EPOCH=$(date -u "+%s")
          END_EPOCH=$((START_EPOCH + TOTAL_MINUTES * 60))

          echo ""
          echo "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..."
          echo "💎 Phiên: AI STV PREMIUM (Ubuntu Desktop)"
          echo "🔗 Kết nối: $TAILSCALE_IP (RDP port 3389)"
          echo ""
          echo "📌 Lưu ý: Lần đầu kết nối có thể mất 10-15 giây để load desktop"
          echo ""

          while true; do
            NOW=$(date -u "+%s")
            REMAINING=$((END_EPOCH - NOW))
            
            if [ $REMAINING -le 0 ]; then
              break
            fi
            
            # Kiểm tra xrdp mỗi 2 phút
            if (( REMAINING % 120 < 5 )); then
              if ! systemctl is-active --quiet xrdp; then
                echo -e "\n⚠️  xrdp đã dừng, khởi động lại..."
                sudo systemctl restart xrdp
              fi
            fi
            
            H=$((REMAINING / 3600))
            M=$(( (REMAINING % 3600) / 60 ))
            S=$((REMAINING % 60))
            printf "\r⏳ Thời gian còn lại: %02d:%02d:%02d" $H $M $S
            sleep 5
          done

          echo ""
          echo "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!"

      # ---------- DỌN DẸP ----------
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        run: |
          echo ""
          echo "🧹 ĐANG DỌN DỄP HỆ THỐNG..."

          # Xóa file mật khẩu
          rm -f /tmp/rdp_password.txt

          # Dừng xrdp
          sudo systemctl stop xrdp || true
          sudo systemctl disable xrdp || true
          
          # Xóa firewall rules
          sudo ufw delete allow 3389/tcp || true
          sudo ufw delete allow 3389/udp || true

          # Xóa user
          sudo userdel -r AISTV-PREMIUM 2>/dev/null || true
          sudo rm -f /etc/sudoers.d/AISTV-PREMIUM

          # Ngắt Tailscale
          sudo tailscale down --accept-risk=all 2>/dev/null || true

          echo "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋"
